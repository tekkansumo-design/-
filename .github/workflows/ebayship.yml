name: eBay Ship APK

on:
  push:
    paths:
      - 'ebayship/**'
      - '.github/workflows/ebayship.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ebayship-gradle-${{ hashFiles('ebayship/**/*.gradle.kts', 'ebayship/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ebayship-gradle-

      - name: Build debug APK
        working-directory: ebayship
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp ebayship/app/build/outputs/apk/debug/app-debug.apk \
             "out/ebay-ship-${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebayship-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ebayship-${{ github.run_number }}
          name: eBay 発送管理 build ${{ github.run_number }}
          body: |
            スマホのブラウザでこのページを開き、下の .apk をタップするとインストールできます。
            「提供元不明のアプリ」の許可を求められたら許可してください。

            初回は アプリの「設定」から eBay の App ID / Cert ID / RuName、
            国際郵便マイページの ID / パスワード、二次元コード通知メールの IMAP を入れてください。
          files: out/*.apk
          generate_release_notes: false
