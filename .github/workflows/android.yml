name: Android APK

on:
  push:
    paths:
      - 'android/**'
      # 画面の生成元と生成スクリプト。ここを変えても APK に影響する
      - 'bookoff_web.py'
      - 'tools/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated asset is up to date
        run: python3 tools/gen_android_asset.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/bookoff-checker-${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BOOKOFF 在庫チェッカー build ${{ github.run_number }}
          body: |
            スマホのブラウザでこのページを開き、下の .apk をタップするとインストールできます。
            「提供元不明のアプリ」の許可を求められたら許可してください。

            インストールするとアイコンが 2 つできます。
            - BOOKOFF検索: アーティスト名で CD / DVD を検索し、定価より指定額以上安い商品の在庫店舗を在庫数の多い順に表示
            - BOOKOFF在庫: 商品ID を登録して在庫店舗をチェック
          files: out/*.apk
          generate_release_notes: false
