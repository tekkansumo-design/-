<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>アーティスト検索</title>
<style>
:root{--bg:#16110d;--panel:#1d1712;--line:#2a2620;--ink:#f0e6da;--dim:#a08d78;
--hit:#e0a458;--warn:#c8553d;--ok:#7f9c6d;--chip:#241d16}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;
font-family:system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:9;background:var(--panel);
border-bottom:1px solid var(--line);padding:10px 12px 0}
h1{font-size:13px;margin:0 0 8px;letter-spacing:.06em;font-weight:700;color:var(--hit);
display:flex;align-items:center}
h1 span{flex:1}
h1 a{font-size:11px;font-weight:400;color:var(--dim);letter-spacing:0}
input[type=text],input[type=number]{width:100%;background:#120e0a;color:var(--ink);
border:1px solid var(--line);border-radius:6px;padding:9px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ck{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);white-space:nowrap}
.ck input{margin:0;width:18px;height:18px;accent-color:var(--hit)}
.num{display:flex;align-items:center;gap:5px;font-size:13px}
.num input{width:84px;padding:6px 8px;font-size:14px}
button{background:var(--line);color:var(--ink);border:1px solid #3a352c;
border-radius:6px;padding:9px 14px;font-size:14px}
button.go{background:var(--hit);color:#1b1309;border-color:var(--hit);font-weight:700;flex:1}
button.stop{background:var(--warn);color:#fff;border-color:var(--warn);flex:1}
button:disabled{opacity:.4}
details{margin-top:6px;font-size:12px;color:var(--dim)}
details .row{margin-top:4px}
#bar{height:3px;background:var(--line);margin-top:9px;border-radius:2px;overflow:hidden}
#bar div{height:100%;width:0;background:var(--hit);transition:width .25s}
#bar.on div{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
#stat{color:var(--dim);font-size:12px;margin-top:6px}
#sum{color:var(--dim);font-size:11px;margin-top:3px;line-height:1.6}
#sum b{color:var(--hit)}
.tabs{display:flex;gap:4px;margin-top:8px;align-items:flex-end}
.tab{padding:7px 13px;border-radius:6px 6px 0 0;font-size:13px;color:var(--dim);
border:1px solid transparent;border-bottom:none}
.tab.on{background:var(--bg);color:var(--hit);border-color:var(--line)}
.tabs .sp{flex:1}
.tabs select{background:#120e0a;color:var(--ink);border:1px solid var(--line);
border-radius:6px;padding:4px;font-size:12px;margin-bottom:4px}
.tabs button{padding:4px 9px;font-size:12px;margin-bottom:4px}
main{padding:10px 12px 40px}
a{color:var(--hit);text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
padding:11px 12px;margin:0 0 8px}
.chead{display:flex;gap:10px;align-items:flex-start}
.rank{flex:none;font-size:12px;color:var(--dim);min-width:22px;padding-top:2px}
.ttl{flex:1;font-size:15px;font-weight:700;line-height:1.45;word-break:break-word}
.addr{font-size:11px;color:var(--dim);font-weight:400;display:block;margin-top:1px}
.badge{flex:none;font-size:13px;font-weight:700;color:var(--hit);background:#2b2118;
border:1px solid #3a2c1d;border-radius:12px;padding:2px 10px;white-space:nowrap}
.badge.z{color:var(--dim);background:transparent;border-color:var(--line);font-weight:400}
.items{margin:8px 0 0;padding:0;list-style:none;display:none}
.card.open .items{display:block}
.items li{font-size:13px;line-height:1.5;padding:5px 0;border-top:1px dashed var(--line)}
.g{font-size:10px;color:#1b1309;background:var(--dim);border-radius:3px;padding:0 4px;margin-right:5px}
.pr{color:var(--dim);font-size:12px;white-space:nowrap}
.pr b{color:var(--ok)}
.more{font-size:11px;color:var(--dim);margin-top:6px}
.err{color:var(--warn);font-size:11px;margin-top:4px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:40px 14px;line-height:1.9}
.empty .big{font-size:15px;color:var(--ink);display:block;margin-bottom:6px}
.note{color:var(--dim);font-size:11px;line-height:1.7;margin-top:14px}
</style></head><body>
<header>
<h1><span>BOOKOFF アーティスト検索</span></h1>
<input type="text" id="artist" placeholder="アーティスト名（例: スピッツ）" enterkeyhint="search">
<div class="row">
<label class="ck"><input type="checkbox" id="gCd" checked>CD</label>
<label class="ck"><input type="checkbox" id="gDvd" checked>DVD・BD</label>
<label class="num">定価との差<input type="number" id="minDiff" value="500" min="0" step="100">円以上</label>
</div>
<details><summary>検索方法</summary>
<div class="row">
<label class="ck"><input type="radio" name="mode" id="mAuthor" checked>アーティスト欄で検索</label>
<label class="ck"><input type="radio" name="mode" id="mKeyword">キーワード検索</label>
</div>
<div class="row">
<label class="ck"><input type="checkbox" id="strict">アーティスト名・タイトルに含むものだけ残す</label>
</div>
</details>
<div class="row">
<button class="go" id="bRun">検索開始</button>
<button class="stop" id="bStop" style="display:none">中止</button>
</div>
<div id="bar"><div></div></div>
<div id="stat">アーティスト名を入れて「検索開始」</div>
<div id="sum"></div>
<div class="tabs">
<div class="tab on" data-t="stores">店舗順</div>
<div class="tab" data-t="products">商品</div>
<div class="sp"></div>
<select id="pref"><option value="">全国</option></select>
<button id="bShare">共有</button>
</div>
</header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>n==null?'':'¥'+Number(n).toLocaleString();
let S=null, ver=-1, tab='stores', pref='', open=new Set(), timer=null;

function loadInputs(){
  try{
    const o=JSON.parse(App.getInputs()||'{}');
    if(o.artist) $('#artist').value=o.artist;
    if(o.minDiff!=null) $('#minDiff').value=o.minDiff;
    if(o.genres){ $('#gCd').checked=o.genres.includes('cd'); $('#gDvd').checked=o.genres.includes('dvd'); }
    if(o.byAuthor===false) $('#mKeyword').checked=true;
    if(o.strict) $('#strict').checked=true;
  }catch(e){}
}

function start(){
  const artist=$('#artist').value.trim();
  const genres=[]; if($('#gCd').checked) genres.push('cd'); if($('#gDvd').checked) genres.push('dvd');
  if(!artist){ $('#stat').textContent='アーティスト名を入れてください'; return; }
  if(!genres.length){ $('#stat').textContent='CD か DVD のどちらかを選んでください'; return; }
  const minDiff=parseInt($('#minDiff').value,10);
  const ok=App.start(JSON.stringify({artist,genres,minDiff:isNaN(minDiff)?500:minDiff,
    byAuthor:$('#mAuthor').checked,strict:$('#strict').checked}));
  if(!ok){ $('#stat').textContent='実行中です'; return; }
  open.clear(); pref=''; $('#artist').blur(); poll();
}

function poll(){
  clearTimeout(timer);
  const raw=App.getState(ver);
  if(raw){ S=JSON.parse(raw); ver=S.version; render(); }
  timer=setTimeout(poll, S&&S.running?700:3000);
}

function render(){
  const run=S.running;
  $('#bRun').style.display=run?'none':''; $('#bStop').style.display=run?'':'none';
  $('#bar').classList.toggle('on',run&&S.phase==='list');
  const pct=S.phase==='stores'&&S.targets?Math.round(S.done/S.targets*100):(S.phase==='done'?100:(run?100:0));
  $('#bar div').style.width=pct+'%';
  $('#stat').textContent=S.message||'';
  if(S.phase==='idle'){ $('#sum').innerHTML=''; renderMain(); return; }
  let sum=`中古 <b>${S.listed}</b> 件中、定価より${S.minDiff}円以上安い <b>${S.targets}</b> 件`;
  sum+=` ／ 在庫店舗 <b>${S.stores.length}</b> 店`;
  const ex=[]; if(S.below) ex.push(`差額不足 ${S.below}`); if(S.noDiff) ex.push(`定価表示なし ${S.noDiff}`);
  if(S.unmatched) ex.push(`名前不一致 ${S.unmatched}`);
  if(ex.length) sum+=`<br>除外: ${ex.join('、')}`;
  $('#sum').innerHTML=sum;
  // 都道府県の選択肢
  const prefs=[...new Set(S.stores.map(s=>s.pref).filter(Boolean))];
  const sel=$('#pref'), cur=sel.value;
  const want=['<option value="">全国</option>'].concat(prefs.map(p=>`<option${p===cur?' selected':''}>${esc(p)}</option>`)).join('');
  if(sel.innerHTML!==want) sel.innerHTML=want;
  pref=sel.value;
  renderMain();
}

function itemLine(p){
  return `<li><span class="g">${esc(p.genre)}</span><a href="${esc(p.url)}">${esc(p.title)}</a> `+
    `<span class="pr">${yen(p.price)}${p.diff!=null?` <b>定価より${p.diff.toLocaleString()}円安</b>`:''}${p.pct!=null?`(${p.pct}%)`:''}</span></li>`;
}

function renderMain(){
  const m=$('#main');
  if(!S||S.phase==='idle'){
    m.innerHTML=`<div class="empty"><span class="big">CD・DVD の在庫店舗を探します</span>`+
      `アーティスト名で中古の CD / DVD を検索し、<br>定価との差が指定額以上の商品だけについて<br>`+
      `入荷している店舗を集計し、在庫数の多い店舗から並べます。</div>`+
      `<div class="note">※ 店舗在庫はブックオフのサイトに表示される「商品が入荷した店舗」の情報です。少し前の情報のため、店頭では売り切れの場合があります。</div>`;
    return;
  }
  if(tab==='stores'){
    const list=S.stores.filter(s=>!pref||s.pref===pref);
    if(!list.length){
      m.innerHTML=`<div class="empty">${S.running?'集計中…':'在庫のある店舗は見つかりませんでした'}</div>`; return;
    }
    let h='', rank=0, last=-1;
    list.forEach((s,i)=>{
      const n=s.items.length; if(n!==last){ rank=i+1; last=n; }
      const key=s.name+'|'+s.address, isOpen=open.has(key);
      const nm=s.url?`<a href="${esc(s.url)}">${esc(s.name)}</a>`:esc(s.name);
      h+=`<div class="card${isOpen?' open':''}" data-k="${esc(key)}"><div class="chead">`+
        `<div class="rank">${rank}</div><div class="ttl">${nm}<span class="addr">${esc(s.address||s.pref||'')}</span></div>`+
        `<div class="badge">${n}点</div></div><ul class="items">${s.items.map(i=>itemLine(S.products[i])).join('')}</ul>`+
        `${isOpen?'':'<div class="more">タップで商品を表示</div>'}</div>`;
    });
    m.innerHTML=h;
  }else{
    if(!S.products.length){ m.innerHTML=`<div class="empty">${S.running?'検索中…':'条件に合う商品はありませんでした'}</div>`; return; }
    const ps=S.products.slice().sort((a,b)=>b.count-a.count||(b.diff||0)-(a.diff||0));
    m.innerHTML=ps.map(p=>{
      const badge=!p.checked?'<div class="badge z">未確認</div>':`<div class="badge${p.count?'':' z'}">${p.count}店</div>`;
      return `<div class="card"><div class="chead"><div class="ttl"><span class="g">${esc(p.genre)}</span>`+
        `<a href="${esc(p.url)}">${esc(p.title)}</a><span class="addr">${esc(p.artist)}</span></div>${badge}</div>`+
        `<div class="pr" style="margin-top:4px">${yen(p.price)}${p.diff!=null?` <b>定価より${p.diff.toLocaleString()}円安</b>`:''}`+
        `${p.online?' ・オンライン在庫あり':''}</div>`+
        `${p.error?`<div class="err">${esc(p.error)}</div>`:''}</div>`;
    }).join('');
  }
}

$('#main').addEventListener('click',e=>{
  if(e.target.closest('a')) return;
  const c=e.target.closest('.card[data-k]'); if(!c) return;
  const k=c.dataset.k; open.has(k)?open.delete(k):open.add(k); renderMain();
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  tab=t.dataset.t; renderMain();
}));
$('#pref').addEventListener('change',e=>{ pref=e.target.value; renderMain(); });
$('#bRun').addEventListener('click',start);
$('#bStop').addEventListener('click',()=>App.cancel());
$('#bShare').addEventListener('click',()=>{ if(S&&S.phase!=='idle') App.share(pref); });
$('#artist').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); });
loadInputs(); poll();
</script></body></html>
